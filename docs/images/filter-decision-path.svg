<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640"
     role="img" aria-label="Only a fresh gate lets an enrolled account through"
     font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="gate-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8178"/>
    </marker>
  </defs>

  <rect width="760" height="640" fill="#ffffff"/>

  <text x="24" y="30" font-size="15" font-weight="600" fill="#1C1A17">Only a fresh gate lets an enrolled account through</text>

  <g fill="none" stroke="#8a8178" stroke-width="1.25">
    <path d="M380 120V148" marker-end="url(#gate-arrow)"/>
    <path d="M380 220V248" marker-end="url(#gate-arrow)"/>
    <path d="M380 320V348" marker-end="url(#gate-arrow)"/>
    <path d="M380 420V448" marker-end="url(#gate-arrow)"/>
    <path d="M488 184H620"/>
    <path d="M488 284H620"/>
    <path d="M488 384H620"/>
    <path d="M488 484H620"/>
    <path d="M620 184V560" marker-end="url(#gate-arrow)"/>
    <path d="M272 384H150"/>
    <path d="M272 484H150"/>
    <path d="M150 384V560" marker-end="url(#gate-arrow)"/>
  </g>

  <g>
    <rect x="260" y="72" width="240" height="48" rx="8" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="380" y="100" text-anchor="middle" fill="#1C1A17">MSV1_0 validated the logon</text>
  </g>

  <g>
    <polygon points="272,184 380,148 488,184 380,220" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="380" y="188" text-anchor="middle" fill="#1C1A17">Network logon?</text>
  </g>
  <g>
    <polygon points="272,284 380,248 488,284 380,320" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="380" y="288" text-anchor="middle" fill="#1C1A17">Enforcement on?</text>
  </g>
  <g>
    <polygon points="272,384 380,348 488,384 380,420" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="380" y="388" text-anchor="middle" fill="#1C1A17">Enrolled by RID?</text>
  </g>
  <g>
    <polygon points="272,484 380,448 488,484 380,520" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="380" y="488" text-anchor="middle" fill="#1C1A17">Gate fresh?</text>
  </g>

  <g>
    <rect x="510" y="560" width="220" height="56" rx="8" fill="none" stroke="#8a8178" stroke-width="1.25"/>
    <text x="620" y="584" text-anchor="middle" font-weight="600" fill="#1C1A17">No objection</text>
    <text x="620" y="602" text-anchor="middle" font-size="11.5" fill="#6B645B">STATUS_SUCCESS</text>
  </g>
  <g>
    <rect x="40" y="560" width="220" height="56" rx="8" fill="#6F4E37" fill-opacity="0.12"
          stroke="#6F4E37" stroke-width="2"/>
    <text x="150" y="584" text-anchor="middle" font-weight="600" fill="#1C1A17">Veto</text>
    <text x="150" y="602" text-anchor="middle" font-size="11.5" fill="#6B645B">STATUS_ACCOUNT_RESTRICTION</text>
  </g>

  <g font-size="11.5" fill="#6B645B">
    <text x="390" y="240">yes</text>
    <text x="390" y="340">on</text>
    <text x="390" y="440">enrolled</text>
    <text x="554" y="176" text-anchor="middle">not a network logon</text>
    <text x="554" y="276" text-anchor="middle">mode off</text>
    <text x="554" y="376" text-anchor="middle">not enrolled</text>
    <text x="554" y="476" text-anchor="middle">fresh</text>
    <text x="211" y="376" text-anchor="middle">index unreadable</text>
    <text x="211" y="476" text-anchor="middle">stale or missing</text>
  </g>
</svg>
