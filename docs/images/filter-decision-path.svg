<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578"
     role="img" aria-label="The filter's decision path. MSV1_0 has checked the password and calls the filter. A logon that is not a network logon to this machine gets no objection, and a pass-through logon counts as not to this machine. Inside a __try frame: with the kill switch Mode = 0 there is no objection; an account that is not enrolled, or a machine without Doppio's index, gets no objection; a failed read of the index is a veto. An enrolled account passes only with a fresh gate; a missing, stale or future timestamp is a veto. An exception in the decision is a veto as well. A veto returns STATUS_INVALID_WORKSTATION and shows as a 4625 with status 0xC0000070, no objection returns STATUS_SUCCESS. On every path, before any return, the filter sets WhichFields and UserFlags to 0 and Authoritative to TRUE.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
    .m { font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace; }
    .ink      { fill: #1c1917; }
    .muted    { fill: #78716c; }
    .accent   { fill: #8a5a2b; }
    .box      { fill: #ffffff; stroke: #c9c4bf; stroke-width: 1.25; }
    .boxalt   { fill: #faf9f7; stroke: #c9c4bf; stroke-width: 1.25; }
    .boxacc   { fill: #fdf6ed; stroke: #bb8c5c; stroke-width: 1.5; }
    .boxoff   { fill: #f3f1ee; stroke: #c9c4bf; stroke-width: 1.25; stroke-dasharray: 4 3; }
    .wire     { stroke: #a8a29e; stroke-width: 1.25; fill: none; }
    .wireacc  { stroke: #bb8c5c; stroke-width: 1.5; fill: none; }
    .frame    { fill: none; stroke: #d8d3ce; stroke-width: 1.25; stroke-dasharray: 5 5; }
    .band     { fill: #f3efe9; }
    .bandacc  { fill: #f6e9d8; }
    .hatch    { fill: url(#hatch); }
    .hatchln  { stroke: #d6d0c9; stroke-width: 1; }
    .head     { fill: #a8a29e; }
    .headacc  { fill: #bb8c5c; }
    .dot      { fill: #a8a29e; }
    .dotacc   { fill: #bb8c5c; }
    .stop     { stroke: #a8a29e; stroke-width: 1.5; }
    .cross    { stroke: #8a5a2b; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      .ink     { fill: #e7e5e4; }
      .muted   { fill: #a8a29e; }
      .accent  { fill: #e0a96d; }
      .box     { fill: #1c1917; stroke: #46413d; }
      .boxalt  { fill: #262220; stroke: #46413d; }
      .boxacc  { fill: #2a211a; stroke: #8f6742; }
      .boxoff  { fill: #1f1b19; stroke: #46413d; }
      .wire    { stroke: #57534e; }
      .wireacc { stroke: #a9764a; }
      .frame   { stroke: #403b38; }
      .band    { fill: #24201d; }
      .bandacc { fill: #33271d; }
      .hatchln { stroke: #3d3734; }
      .head    { fill: #57534e; }
      .headacc { fill: #a9764a; }
      .dot     { fill: #57534e; }
      .dotacc  { fill: #a9764a; }
      .stop    { stroke: #57534e; }
      .cross   { stroke: #e0a96d; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="head" points="0,1 10,5 0,9"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon class="headacc" points="0,1 10,5 0,9"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatchln" x1="0" y1="0" x2="0" y2="6"/>
    </pattern>
  </defs>

  <rect class="boxalt" x="300.0" y="20" rx="3" width="300" height="44"/>
  <text class="ink" x="450" y="40" font-size="12" text-anchor="middle">MSV1_0 has checked the password</text>
  <text class="m muted" x="450" y="56" font-size="10" text-anchor="middle">Msv1_0SubAuthenticationFilter()</text>
  <line class="wire" x1="450" y1="64" x2="450" y2="92" marker-end="url(#a)"/>
  <rect class="frame" x="284.0" y="180" rx="4" width="332" height="276"/>
  <text class="m muted" x="608.0" y="195" font-size="10" text-anchor="end">__try: Decide()</text>
  <rect class="box" x="300.0" y="96" rx="3" width="300" height="58"/>
  <text class="ink" x="316.0" y="120" font-size="12">Network logon to this machine?</text>
  <text class="m muted" x="316.0" y="139" font-size="10">LogonLevel, Flags &amp; MSV1_0_PASSTHRU</text>
  <line class="wire" x1="450" y1="154" x2="450" y2="202" marker-end="url(#a)"/>
  <text class="muted" x="458" y="169" font-size="10" text-anchor="start">yes</text>
  <line class="wire" x1="600.0" y1="125.0" x2="780" y2="125.0"/>
  <text class="muted" x="630.0" y="118.0" font-size="10" text-anchor="start">no, or pass-through</text>
  <circle class="dot" cx="780" cy="125.0" r="2.5"/>
  <rect class="box" x="300.0" y="206" rx="3" width="300" height="58"/>
  <text class="ink" x="316.0" y="230" font-size="12">Enforcement on?</text>
  <text class="m muted" x="316.0" y="249" font-size="10">Mode, cached, refreshed every 5 s</text>
  <line class="wire" x1="450" y1="264" x2="450" y2="292" marker-end="url(#a)"/>
  <text class="muted" x="458" y="279" font-size="10" text-anchor="start">Mode = 1</text>
  <line class="wire" x1="600.0" y1="235.0" x2="780" y2="235.0"/>
  <text class="muted" x="630.0" y="228.0" font-size="10" text-anchor="start">Mode = 0</text>
  <circle class="dot" cx="780" cy="235.0" r="2.5"/>
  <rect class="box" x="300.0" y="296" rx="3" width="300" height="58"/>
  <text class="ink" x="316.0" y="320" font-size="12">Enrolled by RID?</text>
  <text class="m muted" x="316.0" y="339" font-size="10">Doppio's 2FA\Rids\&lt;rid&gt;</text>
  <line class="wire" x1="450" y1="354" x2="450" y2="382" marker-end="url(#a)"/>
  <text class="muted" x="458" y="369" font-size="10" text-anchor="start">yes</text>
  <line class="wire" x1="600.0" y1="325.0" x2="780" y2="325.0"/>
  <text class="muted" x="630.0" y="318.0" font-size="10" text-anchor="start">no, or no index</text>
  <circle class="dot" cx="780" cy="325.0" r="2.5"/>
  <line class="wireacc" x1="300.0" y1="325.0" x2="120" y2="325.0"/>
  <text class="accent" x="270.0" y="318.0" font-size="10" text-anchor="end">read failed</text>
  <circle class="dotacc" cx="120" cy="325.0" r="2.5"/>
  <rect class="boxacc" x="300.0" y="386" rx="3" width="300" height="58"/>
  <text class="accent" x="316.0" y="410" font-size="12">Gate fresh?</text>
  <text class="m muted" x="316.0" y="429" font-size="10">Gate\&lt;rid&gt;, age &lt;= WindowSec</text>
  <line class="wire" x1="600.0" y1="415.0" x2="780" y2="415.0"/>
  <text class="muted" x="630.0" y="408.0" font-size="10" text-anchor="start">fresh</text>
  <circle class="dot" cx="780" cy="415.0" r="2.5"/>
  <line class="wireacc" x1="300.0" y1="415.0" x2="120" y2="415.0"/>
  <text class="accent" x="270.0" y="408.0" font-size="10" text-anchor="end">missing, stale, in the future</text>
  <circle class="dotacc" cx="120" cy="415.0" r="2.5"/>
  <line class="wireacc" x1="284.0" y1="450" x2="120" y2="450"/>
  <text class="accent" x="270.0" y="443" font-size="10" text-anchor="end">exception: fail closed</text>
  <circle class="dotacc" cx="120" cy="450" r="2.5"/>
  <line class="wire" x1="780" y1="125.0" x2="780" y2="492" marker-end="url(#a)"/>
  <line class="wireacc" x1="120" y1="325.0" x2="120" y2="492" marker-end="url(#b)"/>
  <rect class="boxacc" x="20" y="496" rx="3" width="260" height="62"/>
  <text class="accent" x="36" y="519" font-size="12.5">Veto</text>
  <text class="m muted" x="36" y="537" font-size="10">STATUS_INVALID_WORKSTATION</text>
  <text class="muted" x="36" y="551" font-size="10">4625 with status 0xC0000070</text>
  <rect class="box" x="620" y="496" rx="3" width="260" height="62"/>
  <text class="ink" x="636" y="519" font-size="12.5">No objection</text>
  <text class="m muted" x="636" y="537" font-size="10">STATUS_SUCCESS</text>
  <text class="muted" x="636" y="551" font-size="10">MSV1_0 builds the token</text>
  <text class="muted" x="450" y="519" font-size="10" text-anchor="middle">either way, before any return</text>
  <text class="m muted" x="450" y="537" font-size="10" text-anchor="middle">WhichFields = 0, UserFlags = 0</text>
  <text class="m muted" x="450" y="551" font-size="10" text-anchor="middle">Authoritative = TRUE</text>
</svg>
