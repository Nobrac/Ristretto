name: build
on: [push, pull_request]

jobs:
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: .\build-ristretto.bat

      # The scripts run in Windows PowerShell 5.1, so parse them there. A
      # syntax error in an installer that edits the LSA configuration should
      # fail CI, not the VM.
      - name: Parse every PowerShell script
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "$($f.Name):$($e.Extent.StartLineNumber): $($e.Message)"; $bad++ }
          }
          if ($bad) { throw "$bad PowerShell parse error(s)" }
          Write-Host "All scripts parse."

      # The filter is built with /WX, so a new warning in lsass-resident code
      # fails the job rather than shipping. This job proves it compiles and
      # exports the one symbol; the tests job below covers behaviour.
      - name: Check the filter exports exactly one symbol
        shell: pwsh
        # dumpbin returns an array of lines, and -match/-notmatch on an array
        # filters it instead of returning true/false. The old check
        # ($out -notmatch 'name') returned every line without the name, which
        # is never empty, so it threw on every run. Parse the export table
        # line by line instead: ordinal, hint, RVA, name.
        run: |
          $out = & dumpbin /exports RistrettoFilter.dll
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
          $exports = @(foreach ($line in $out) {
            if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]{8}\s+(\S+)') { $Matches[1] }
          })
          Write-Host "Exports: $($exports -join ', ')"
          if ($exports.Count -ne 1 -or $exports[0] -ne 'Msv1_0SubAuthenticationFilter') {
            throw "RistrettoFilter.dll must export exactly Msv1_0SubAuthenticationFilter, found: $($exports -join ', ')"
          }
          Write-Host "Export present, and it is the only one."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ristretto
          path: |
            RistrettoFilter.dll
            ristretto.exe

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # The real filter and Doppio's store_index.cpp against fakes, under
      # AddressSanitizer and UBSan. See tests/test_filter.cpp for what it
      # can and cannot show.
      - name: Filter behaviour test
        run: make -C tests
